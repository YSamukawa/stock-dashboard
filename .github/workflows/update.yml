name: Update market data

on:
  schedule:
    # 22:30 UTC = 07:30 JST (火〜土) = 米国市場の引け後（EDT 18:30 / EST 17:30）
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests (parsers / analytics)
        run: node test/run.js
      - name: Fetch data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: node scripts/fetch.js
      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
